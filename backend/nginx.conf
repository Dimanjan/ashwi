# Nginx configuration for Ashwi Furniture backend on Kamatera VPS
server {
    listen 80;
    server_name api.ashwifurniture.com api.ashwifurniture.com.np _;

    client_max_body_size 25M;

    # GZip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Media uploads caching
    location /media/ {
        alias /var/www/ashwi/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API endpoints reverse proxy to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for live updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
