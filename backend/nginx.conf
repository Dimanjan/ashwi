# ==============================================================================
# Ashwi Furniture - Stealth Hardened Nginx Configuration
# Prevents Direct IP Discovery, Shodan/Censys Indexing, and Port Scanning
# ==============================================================================

# 1. DEFAULT SERVER BLOCK: Drop all direct IP connections and unknown Host headers
# Returns 444 (nginx non-standard code that closes connection without response)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 444;
}

# 2. AUTHENTICATED HOST BLOCK: Only serves validated domain via Cloudflare Proxy
server {
    listen 80;
    server_name ashwifurniture.sajedar.com;

    server_tokens off;
    client_max_body_size 25M;

    # Hide backend infrastructure headers
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # GZip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Media uploads caching
    location /media/ {
        alias /var/www/ashwi/backend/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API endpoints reverse proxy to FastAPI
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

